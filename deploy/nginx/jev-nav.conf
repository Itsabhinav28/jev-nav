# Render with:  sed 's/DOMAIN/yourdomain.com/g' jev-nav.conf   (or deploy/scripts/render-nginx.sh)
# (listen ... http2 is the syntax for Ubuntu 22.04 nginx 1.18; newer nginx only warns.)
# One Let's Encrypt certificate covers u1/u2/u3.DOMAIN; certbot names it after the first -d value,
# hence /etc/letsencrypt/live/u1.DOMAIN/.  Needs /etc/nginx/snippets/jev-proxy.conf (jev-proxy.inc).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME challenge + redirect ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name u1.DOMAIN u2.DOMAIN u3.DOMAIN;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── Instance 1 ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name u1.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/u1.DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/u1.DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include snippets/jev-proxy.conf;

    # Health check without password (for uptime monitors); returns only "ok"
    location = /healthz { auth_basic off; proxy_pass http://127.0.0.1:8081; }

    # Long-lived / streaming responses: never buffer
    location ~ ^/(preview\.mjpg|nav\.jpg|slam\.jpg)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / { proxy_pass http://127.0.0.1:8081; }
}

# ── Instance 2 ───────────────────────────────────────────────────────────────
