# Render with:  sed 's/APP_HOST/app.example.com/g' jev-nav.conf   (or deploy/scripts/render-nginx.sh)
# (listen ... http2 is the syntax for Ubuntu 22.04 nginx 1.18; newer nginx only warns.)
# One Let's Encrypt certificate for APP_HOST; certbot stores it under /etc/letsencrypt/live/APP_HOST/.
# Needs /etc/nginx/snippets/jev-proxy.conf (jev-proxy.inc) and /etc/nginx/jev-access.conf
# (created by deploy/scripts/make-access-key.sh: the secret-link maps).

include /etc/nginx/jev-access.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: ACME challenge + redirect ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name APP_HOST;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── The app (one container, one phone at a time) ─────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_HOST;

    ssl_certificate     /etc/letsencrypt/live/APP_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    include snippets/jev-proxy.conf;

    # Long-lived / streaming responses: never buffer
    location ~ ^/(preview\.mjpg|nav\.jpg|slam\.jpg)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / { proxy_pass http://127.0.0.1:8081; }
}
