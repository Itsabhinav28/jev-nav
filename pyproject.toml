[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-nav"
version = "0.1.0"
description = "First-person navigation assistant: a council of Jev (TypeSafe) agents decides, a Nemotron companion talks."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk[pil]>=0.7.5",
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
stream = ["aiortc>=1.9", "aiohttp>=3.9", "cryptography>=42", "qrcode[pil]>=7", "imageio-ffmpeg>=0.5"]

[project.scripts]
jev-nav = "jev_nav.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
